<html lang="en">

<script>
// Applied before the stylesheet paints anything, so the page never flashes
// the wrong theme on load.
(function(){
  try{
    var saved = localStorage.getItem('mmtrades-theme');
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ /* localStorage unavailable; defaults to light */ }
})();
</script>
<style>
  :root{
    --ink:#14171c;
    --muted:#6b7280;
    --line:#e7e9ec;
    --green:#0f8a4c;
    --green-bg:#eaf7ef;
    --red:#d1352b;
    --red-bg:#fdeeed;
    --accent:#2f6fed;
    --accent-bg:rgba(47,111,237,0.12);
    --panel:#fafbfc;
    --bg:#ffffff;
    --btn-bg:#ffffff;
    --hover-bg:#f4f5f6;
    --synced-c:#a7abb2;
    --stale-c:#e0a83b;
    --grid-line:#f0f1f3;
    --green-rgb:15,138,76;
    --red-rgb:209,53,43;
  }
  html[data-theme="dark"]{
    --ink:#e7e9ee;
    --muted:#9aa1ac;
    --line:#2a2f38;
    --green:#33c47a;
    --green-bg:rgba(51,196,122,0.14);
    --red:#f0635a;
    --red-bg:rgba(240,99,90,0.14);
    --accent:#6c93f5;
    --accent-bg:rgba(108,147,245,0.16);
    --panel:#171a1f;
    --bg:#0f1115;
    --btn-bg:#1b1e24;
    --hover-bg:#20242b;
    --synced-c:#5b6068;
    --stale-c:#e0a83b;
    --grid-line:#20242b;
    --green-rgb:51,196,122;
    --red-rgb:240,99,90;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; min-height:100vh; }
  body{
    margin:0; padding:28px 32px 60px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    max-width:1700px; margin-left:auto; margin-right:auto;
  }
  .top-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:-0.01em; }
  .top-actions{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    border:1px solid var(--line); background:var(--btn-bg); border-radius:8px;
    width:32px; height:32px; cursor:pointer; font-size:15px; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--hover-bg); }
  .icon-btn.spin svg{ animation:spin 0.8s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .status-line{ font-size:12px; color:var(--synced-c); margin-bottom:22px; }
  .status-line.stale{ color:var(--stale-c); }
  .section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:26px 0 10px; }
  .chart-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px 12px; margin-bottom:20px;
  }
  .chart-card h3{ margin:0 0 12px; font-size:13px; font-weight:700; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  .chart-card .chart-body{ position:relative; height:340px; }
  .chart-card.weekly .chart-body{ height:380px; }
  .chart-row{ display:flex; gap:20px; align-items:stretch; }
  .chart-row .chart-card{ flex:1; min-width:0; margin-bottom:0; }
  @media (max-width:760px){
    .chart-row{ flex-direction:column; }
  }
  .month-nav{ display:flex; align-items:center; gap:8px; font-weight:500; }
  .month-nav button{
    border:1px solid var(--line); background:var(--btn-bg); border-radius:6px;
    width:24px; height:24px; cursor:pointer; font-size:12px; color:var(--ink);
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .month-nav button:hover{ background:var(--hover-bg); }
  .month-nav span{ font-size:12px; color:var(--muted); min-width:34px; text-align:center; }
  .summary-pill{ font-size:13px; color:var(--muted); display:flex; gap:14px; align-items:center; margin-top:2px; }
  .summary-pill b{ color:var(--ink); }
  .pnl-pos{ color:var(--green); font-weight:700; }
  .pnl-neg{ color:var(--red); font-weight:700; }
  .seg-btn{
    border:1px solid var(--line); background:var(--btn-bg); border-radius:6px;
    padding:4px 10px; cursor:pointer; font-size:12px; color:var(--ink); font-weight:500;
  }
  .seg-btn:hover{ background:var(--hover-bg); }
  .heat-wrap{ overflow-x:auto; }
  table.heat{ border-collapse:separate; border-spacing:4px; width:100%; min-width:760px; table-layout:fixed; }
  table.heat th{ font-size:11px; font-weight:600; color:var(--muted); padding:4px 2px; text-align:center; }
  table.heat th.rowh{ text-align:right; padding-right:8px; width:52px; }
  table.heat td{
    height:56px; border-radius:6px; text-align:center; vertical-align:middle;
    font-size:12px; font-weight:700; color:var(--ink); background:var(--hover-bg);
  }
  table.heat td small{ display:block; font-size:10px; font-weight:500; opacity:.7; margin-top:2px; }
  table.heat td.empty{ color:var(--synced-c); font-weight:400; background:transparent; border:1px dashed var(--line); }
  table.heat td.total{ background:transparent; border:1px solid var(--line); }
  footer{ text-align:center; font-size:11px; color:var(--muted); margin-top:8px; }
  @media (max-width:640px){
    body{ padding:20px 16px 40px; }
  }
</style>

<script>
function fmtMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2);
}
function cv(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
// Dates are always handled in local time. localKey() builds YYYY-MM-DD from the
// LOCAL year/month/day (toISOString() converts to UTC, which shifts the date by
// a day in time zones ahead of UTC, such as Nairobi).
function parseLocal(str){ return new Date(str + "T00:00:00"); }
function localKey(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ---- Load Chart.js, trying a few mirrors in case one is blocked/unreachable ----
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error('failed to load ' + src));
    document.head.appendChild(s);
  });
}
const CHART_JS_MIRRORS = [
  "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js",
  "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js",
  "https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js",
];
async function loadChartJs(){
  for(const url of CHART_JS_MIRRORS){
    try{
      await loadScript(url);
      if(typeof Chart !== 'undefined') return true;
    }catch(e){ /* try next mirror */ }
  }
  return false;
}

// ---- Status line (mirrors the other MMTrades dashboards' staleness check) ----
function updateStatusLine(){
  const statusLine = document.getElementById('statusLine');
  if(!DATA_SYNCED_AT){ statusLine.textContent = ''; return; }
  const synced = new Date(DATA_SYNCED_AT);
  const ageMin = (Date.now() - synced.getTime()) / 60000;
  const stale = ageMin > 30;
  statusLine.className = 'status-line' + (stale ? ' stale' : '');
  statusLine.textContent = `Last synced ${synced.toLocaleString()}${stale ? ' — sync may be delayed' : ''}`;
}

// ---- Horizontal bar helpers (categories on the Y axis, dollars on the X axis) ----

// Draws the dollar value at the end of each bar: to the right of positive bars,
// to the left of negative bars.
const barValueLabelPlugin = {
  id: 'barValueLabel',
  afterDatasetsDraw(chart){
    const { ctx } = chart;
    const meta = chart.getDatasetMeta(0);
    const data = chart.data.datasets[0].data;
    const inkC = cv('--ink');
    const mutedC = cv('--muted');
    const counts = chart.data.datasets[0].counts; // optional: trade count per bar
    ctx.save();
    ctx.font = '600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = inkC;
    meta.data.forEach((bar, i) => {
      const val = data[i];
      if(counts && counts[i] === 0){
        ctx.save();
        ctx.font = 'italic 500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif';
        ctx.fillStyle = mutedC;
        ctx.textAlign = 'left';
        ctx.fillText('no trades', bar.x + 6, bar.y);
        ctx.restore();
        return;
      }
      if(!val && !counts) return; // weekly chart: skip empty bars
      const label = fmtMoney(val);
      if(val >= 0){
        ctx.textAlign = 'left';
        ctx.fillText(label, bar.x + 6, bar.y);
      }else{
        ctx.textAlign = 'right';
        ctx.fillText(label, bar.x - 6, bar.y);
      }
    });
    ctx.restore();
  }
};

function barColors(values){
  return values.map(v => v >= 0 ? 'rgba(15,138,76,0.75)' : 'rgba(209,53,43,0.75)');
}

function horizontalBarOptions(labelFontSize){
  const mutedC = cv('--muted');
  const gridC = cv('--grid-line');
  return {
    indexAxis: 'y',
    responsive: true, maintainAspectRatio: false,
    layout: { padding: { top: 10, bottom: 10, left: 4, right: 56 } },
    plugins: {
      legend: { display:false },
      tooltip: { callbacks: { label: (ctx)=>fmtMoney(ctx.parsed.x) } }
    },
    scales: {
      y: { ticks: { color:mutedC, font:{size:labelFontSize}, autoSkip:false }, grid:{ display:false } },
      // grace adds headroom on both ends so the value label of the longest bar never runs into the category labels
      x: { grace: '20%', ticks: { color:mutedC, font:{size:10}, callback:(v)=>(v<0?'-':'')+'$'+Math.abs(v) }, grid:{ color:gridC } }
    }
  };
}

// ---- Day of Week chart: cumulative P&L for Mon–Fri across all trades ----
let weekdayChartInstance = null;
function weekdayAggregate(trades){
  const sums = [0,0,0,0,0];
  trades.forEach(t => {
    const d = new Date(t.date + "T00:00:00");
    const dow = d.getDay(); // 0=Sun .. 6=Sat
    if(dow >= 1 && dow <= 5) sums[dow-1] += Number(t.pnl) || 0;
  });
  return sums;
}
function renderWeekdayChart(trades){
  const wdLabels = ['Mon','Tue','Wed','Thu','Fri'];
  const wdData = weekdayAggregate(trades);
  const wdCounts = [0,0,0,0,0];
  trades.forEach(t => {
    const dow = parseLocal(t.date).getDay();
    if(dow >= 1 && dow <= 5) wdCounts[dow-1] += 1;
  });
  const ctx = document.getElementById('weekdayChart').getContext('2d');
  if(weekdayChartInstance) weekdayChartInstance.destroy();
  weekdayChartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels: wdLabels, datasets: [{ data: wdData, counts: wdCounts, backgroundColor: barColors(wdData), borderRadius: 4, maxBarThickness: 40, categoryPercentage: 0.55, barPercentage: 0.9 }] },
    options: horizontalBarOptions(11),
    plugins: [barValueLabelPlugin]
  });
}

// ---- Monthly chart: sum of P&L per calendar month for a given year, with year nav ----
let monthlyChartInstance = null;
let monthlyYear = new Date().getFullYear();
function renderMonthlyChart(trades, year){
  const sums = new Array(12).fill(0);
  const counts = new Array(12).fill(0);
  trades.forEach(t => {
    const d = parseLocal(t.date);
    if(d.getFullYear() === year){
      sums[d.getMonth()] += Number(t.pnl) || 0;
      counts[d.getMonth()] += 1;
    }
  });
  const labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('yearLabel').textContent = year;
  const ctx = document.getElementById('monthlyChart').getContext('2d');
  if(monthlyChartInstance) monthlyChartInstance.destroy();
  monthlyChartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: sums, counts, backgroundColor: barColors(sums), borderRadius: 4, maxBarThickness: 22, categoryPercentage: 0.75, barPercentage: 0.9 }] },
    options: horizontalBarOptions(11),
    plugins: [barValueLabelPlugin]
  });
}

// ---- Weekly chart: sum of P&L per trading week (Mon–Sun bucket, labeled by
// that week's Monday), across all-time. Weeks with zero trades are skipped
// entirely rather than shown as empty bars. Bars run horizontally, oldest week
// at the top, and the card grows taller as more weeks accumulate. ----
let weeklyChartInstance = null;
let weeklyNewestFirst = false;
try{ weeklyNewestFirst = localStorage.getItem('mmtrades-weekly-order') === 'newest'; }catch(e){ /* storage may be blocked */ }

function mondayOf(dateObj){
  const d = new Date(dateObj);
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = day === 0 ? -6 : 1 - day; // shift back to Monday
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function weeklyAggregate(trades){
  const buckets = {}; // isoMondayDate -> sum
  trades.forEach(t => {
    const d = new Date(t.date + "T00:00:00");
    const monday = mondayOf(d);
    const key = localKey(monday);
    buckets[key] = (buckets[key] || 0) + (Number(t.pnl) || 0);
  });
  const keys = Object.keys(buckets).sort();
  const labels = keys.map(k => {
    const d = new Date(k + "T00:00:00");
    return d.toLocaleDateString('en-US', { month:'short', day:'2-digit' });
  });
  const values = keys.map(k => Math.round(buckets[k] * 100) / 100);
  return { keys, labels, values };
}
function renderWeeklyChart(trades){
  const { keys, labels, values } = weeklyAggregate(trades);
  if(keys.length){
    const first = new Date(keys[0] + "T00:00:00").toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    const last = new Date(keys[keys.length-1] + "T00:00:00").toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    document.getElementById('weeklyRangePill').textContent = `${first} – ${last}`;
  }
  if(weeklyNewestFirst){ labels.reverse(); values.reverse(); }
  document.getElementById('weeklyOrderBtn').innerHTML = weeklyNewestFirst ? 'Newest first &darr;' : 'Oldest first &darr;';
  // ~26px per week so every label stays readable
  document.getElementById('weeklyBody').style.height = Math.max(380, values.length * 26 + 40) + 'px';
  const ctx = document.getElementById('weeklyChart').getContext('2d');
  if(weeklyChartInstance) weeklyChartInstance.destroy();
  weeklyChartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: barColors(values), borderRadius: 4, maxBarThickness: 18, categoryPercentage: 0.8, barPercentage: 0.9 }] },
    options: horizontalBarOptions(10),
    plugins: [barValueLabelPlugin]
  });
}

// ---- Heatmap: net P&L for every weekday x month cell of the selected year ----
function renderHeatmap(trades, year){
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
  const cells = DAYS.map(() => MONTHS.map(() => ({ pnl:0, n:0 })));
  trades.forEach(t => {
    const d = parseLocal(t.date);
    if(d.getFullYear() !== year) return;
    const dow = d.getDay();
    if(dow < 1 || dow > 5) return;
    const c = cells[dow-1][d.getMonth()];
    c.pnl += Number(t.pnl) || 0;
    c.n += 1;
  });
  let maxAbs = 0;
  cells.forEach(row => row.forEach(c => { maxAbs = Math.max(maxAbs, Math.abs(c.pnl)); }));
  const fmt0 = v => (v < 0 ? '-' : '') + '$' + Math.abs(Math.round(v)).toLocaleString('en-US');
  const plural = n => n + ' trade' + (n === 1 ? '' : 's');

  function cellHtml(c, title){
    if(c.n === 0) return `<td class="empty" title="${title}: no trades">&ndash;</td>`;
    const alpha = (0.15 + 0.5 * (maxAbs ? Math.abs(c.pnl) / maxAbs : 0)).toFixed(2);
    const rgb = c.pnl >= 0 ? '--green-rgb' : '--red-rgb';
    return `<td style="background:rgba(var(${rgb}), ${alpha})" title="${title}: ${fmtMoney(c.pnl)} over ${plural(c.n)}">${fmt0(c.pnl)}<small>${plural(c.n)}</small></td>`;
  }
  function totalHtml(sum, n, title){
    if(n === 0) return `<td class="total empty" title="${title}: no trades">&ndash;</td>`;
    return `<td class="total" title="${title}: ${fmtMoney(sum)} over ${plural(n)}"><span class="${sum >= 0 ? 'pnl-pos' : 'pnl-neg'}">${fmt0(sum)}</span><small>${plural(n)}</small></td>`;
  }

  let html = '<table class="heat"><thead><tr><th class="rowh"></th>' +
    MONTHS.map(m => `<th>${m}</th>`).join('') + '<th>Total</th></tr></thead><tbody>';
  const colSum = new Array(12).fill(0), colN = new Array(12).fill(0);
  let grandSum = 0, grandN = 0;
  DAYS.forEach((day, r) => {
    let rowSum = 0, rowN = 0;
    html += `<tr><th class="rowh">${day}</th>`;
    MONTHS.forEach((m, c) => {
      const cell = cells[r][c];
      rowSum += cell.pnl; rowN += cell.n;
      colSum[c] += cell.pnl; colN[c] += cell.n;
      html += cellHtml(cell, `${day} ${m} ${year}`);
    });
    grandSum += rowSum; grandN += rowN;
    html += totalHtml(rowSum, rowN, `${day} ${year}`) + '</tr>';
  });
  html += '<tr><th class="rowh">Total</th>';
  MONTHS.forEach((m, c) => { html += totalHtml(colSum[c], colN[c], `${m} ${year}`); });
  html += totalHtml(grandSum, grandN, `All ${year}`) + '</tr></tbody></table>';

  document.getElementById('heatmap').innerHTML = html;
  document.getElementById('heatYearLabel').textContent = `${year} \u00b7 follows the year arrows above`;
}

function renderAll(){
  renderHeatmap(TRADES, monthlyYear);
  if(typeof Chart === 'undefined'){
    document.querySelectorAll('.chart-body').forEach(el => {
      el.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;padding:0 12px;">Charts library couldn\'t load (network/ad-blocker may be blocking it).</div>';
    });
    return;
  }
  renderWeekdayChart(TRADES);
  renderMonthlyChart(TRADES, monthlyYear);
  renderWeeklyChart(TRADES);
}

document.getElementById('yearPrev').addEventListener('click', () => { monthlyYear -= 1; renderHeatmap(TRADES, monthlyYear); renderMonthlyChart(TRADES, monthlyYear); });
document.getElementById('yearNext').addEventListener('click', () => { monthlyYear += 1; renderHeatmap(TRADES, monthlyYear); renderMonthlyChart(TRADES, monthlyYear); });

document.getElementById('weeklyOrderBtn').addEventListener('click', () => {
  weeklyNewestFirst = !weeklyNewestFirst;
  try{ localStorage.setItem('mmtrades-weekly-order', weeklyNewestFirst ? 'newest' : 'oldest'); }catch(e){ /* storage may be blocked */ }
  if(typeof Chart !== 'undefined') renderWeeklyChart(TRADES);
});

// ---- Theme toggle ----
function applyThemeButtonIcon(){
  const theme = document.documentElement.getAttribute('data-theme');
  const icon = document.getElementById('themeIcon');
  icon.innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}
applyThemeButtonIcon();
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('mmtrades-theme', next); }catch(e){ /* storage may be blocked */ }
  applyThemeButtonIcon();
  if(typeof Chart !== 'undefined') renderAll();
});

// ---- Sync button: re-fetches this page's own HTML and pulls the freshest
// TRADES out of the SYNC_MARKER block, same pattern as the other dashboards ----
const syncBtn = document.getElementById('syncBtn');
const syncIcon = document.getElementById('syncIcon');

async function refetchSyncedData(){
  const url = window.location.pathname + '?t=' + Date.now();
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error('Fetch failed: ' + res.status);
  const html = await res.text();
  const m = html.match(/\/\/ SYNC_MARKER_START([\s\S]*?)\/\/ SYNC_MARKER_END/);
  if(!m) throw new Error('SYNC_MARKER block not found');
  const block = m[1];
  const syncedAtMatch = block.match(/const DATA_SYNCED_AT = "([^"]*)"/);
  const tradesMatch = block.match(/const TRADES = (\[[\s\S]*?\]);/);
  if(syncedAtMatch) window.DATA_SYNCED_AT_LIVE = syncedAtMatch[1];
  if(tradesMatch) window.TRADES_LIVE = JSON.parse(tradesMatch[1]);
}

async function runSync(){
  syncBtn.disabled = true;
  syncIcon.classList.add('spin');
  syncBtn.title = 'Syncing…';
  try{
    await refetchSyncedData();
    if(window.TRADES_LIVE){
      TRADES.length = 0;
      TRADES.push(...window.TRADES_LIVE);
    }
    renderAll();
    updateStatusLine();
    syncBtn.title = 'Synced';
  }catch(err){
    console.error(err);
    syncBtn.title = 'Sync failed — click to retry';
  }finally{
    syncIcon.classList.remove('spin');
    syncBtn.disabled = false;
    setTimeout(() => { syncBtn.title = 'Refresh with the latest synced data'; }, 2000);
  }
}
syncBtn.addEventListener('click', runSync);

// Same 5-minute auto-refresh cadence as the other MMTrades dashboards
const AUTO_REFRESH_MS = 5 * 60 * 1000;
setInterval(() => {
  if(document.visibilityState === 'visible') runSync();
}, AUTO_REFRESH_MS);

updateStatusLine();
renderHeatmap(TRADES, monthlyYear); // doesn't need Chart.js, so draw it right away
loadChartJs().then(renderAll);
</script>
